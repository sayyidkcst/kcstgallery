<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>KCST Gallery | Mobile App Experience</title>
<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- JSZip for batch ZIP download -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, 'Inter', 'Segoe UI', system-ui, Helvetica, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #050505;
    color: #ededed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* Mobile app-like status bar handling */
.status-bar-padding {
    padding-top: constant(safe-area-inset-top);
    padding-top: env(safe-area-inset-top);
}

/* ========= AUTH SCREENS ========= */
.auth-screen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.98);
    backdrop-filter: blur(20px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    padding: 20px;
}
.auth-box {
    width: 100%;
    max-width: 380px;
    background: rgba(18, 18, 18, 0.95);
    padding: 32px 24px;
    border-radius: 48px;
    text-align: center;
    border: 1px solid rgba(0, 255, 213, 0.2);
    box-shadow: 0 30px 50px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
}
.auth-logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    border-radius: 24px;
    background: linear-gradient(135deg, #00ffd5, #008cff);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
    color: #000;
}
.auth-box h1 { font-size: 26px; margin-bottom: 6px; letter-spacing: -0.5px; }
.auth-box p { color: #aaa; margin-bottom: 24px; font-size: 13px; }
.auth-box input {
    width: 100%;
    height: 52px;
    margin-bottom: 14px;
    border: none;
    outline: none;
    border-radius: 28px;
    background: #1e1e1e;
    color: white;
    padding: 0 18px;
    font-size: 15px;
    transition: 0.2s;
}
.auth-box input:focus { background: #2a2a2a; }
.auth-btn {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 28px;
    background: #00ffd5;
    color: black;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    margin-bottom: 12px;
}
.auth-btn:hover { background: #00e0bc; transform: scale(0.98);}
.google-btn {
    background: #ffffff;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}
.google-btn:hover { background: #e8e8e8; transform: scale(0.98);}
.google-btn i { font-size: 20px; color: #db4437; }
.auth-divider {
    color: #666;
    font-size: 11px;
    margin: 16px 0;
    position: relative;
}
.auth-divider::before,
.auth-divider::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 40%;
    height: 1px;
    background: #333;
}
.auth-divider::before { left: 0; }
.auth-divider::after { right: 0; }
.auth-switch { margin-top: 16px; color: #888; font-size: 13px;}
.auth-switch span { color: #00ffd5; cursor: pointer; font-weight: 600;}
.auth-error { color: #ff6b6b; margin-top: 12px; font-size: 12px;}

/* ========= HEADER - Mobile Optimized ========= */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: rgba(10, 10, 10, 0.96);
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 1000;
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
    width: 42px; height: 42px;
    border-radius: 14px;
    background: linear-gradient(135deg, #00ffd5, #008cff);
    display: flex; justify-content: center; align-items: center;
    color: black; font-size: 20px;
}
.logo-text h1 { font-size: 18px; font-weight: 700; }
.logo-text p { color: #aaa; font-size: 9px; margin-top: 2px; }
.top-right { display: flex; gap: 8px; align-items: center; }
.user-info {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #1a1a1a;
    padding: 4px 12px 4px 8px;
    border-radius: 40px;
}
.user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
}
.user-name {
    font-size: 12px;
    font-weight: 500;
    color: #ddd;
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.search-box {
    position: relative;
    display: none; /* Hidden on mobile, shows in expanded view */
}
.search-box.mobile-visible {
    display: block;
    position: absolute;
    top: 70px;
    left: 0;
    right: 0;
    padding: 12px 16px;
    background: #0c0c0c;
    z-index: 999;
}
.search-box input {
    width: 100%;
    height: 44px;
    border-radius: 30px;
    background: #1a1a1a;
    border: 1px solid #2c2c2c;
    outline: none;
    padding: 0 20px 0 45px;
    color: white;
    font-size: 14px;
}
.search-box i {
    position: absolute; left: 28px; top: 50%;
    transform: translateY(-50%);
    color: #aaa;
    font-size: 16px;
}
.icon-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #1a1a1a;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}
.icon-btn:active { background: #00ffd5; color: black; transform: scale(0.95); }

/* Mobile search toggle button */
.search-toggle {
    background: #1a1a1a;
}

/* ========= SELECTION BAR ========= */
.selection-bar {
    position: fixed;
    top: 70px;
    left: 0;
    width: 100%;
    background: rgba(12, 12, 12, 0.98);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid #00ffd5;
    height: 60px;
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 998;
}
.selection-actions { display: flex; gap: 8px; flex-wrap: nowrap; }
.action-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
    font-size: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.action-btn:active { transform: scale(0.92); }
.delete-btn { background: #dc2626; color: white; }
.download-btn { background: #2c7da0; color: white; }
.download-zip-btn { background: #6c5ce7; color: white; }
.select-all-btn { background: #3b82f6; color: white; }
.clear-all-btn { background: #555; color: white; }
#selectedCount { font-weight: 800; color: #00ffd5; font-size: 22px; margin-right: 4px; }

/* ========= GALLERY - Mobile Optimized Masonry ========= */
.gallery {
    column-count: 2;
    column-gap: 12px;
    padding: 145px 12px 80px;
}
.gallery-item {
    position: relative;
    break-inside: avoid;
    margin-bottom: 12px;
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    background: #121212;
    transition: 0.15s;
}
.gallery-item img {
    width: 100%;
    display: block;
    border-radius: 20px;
    transition: 0.15s ease;
}
.gallery-item:active img { transform: scale(0.98); }
.gallery-item.selected img {
    outline: 3px solid #00ffd5;
    outline-offset: -1px;
    border-radius: 20px;
}
.checkmark {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
    opacity: 0;
    transition: 0.15s;
    pointer-events: none;
}
.gallery-item.selected .checkmark {
    opacity: 1;
    background: #00ffd5;
    color: black;
}
.overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 20px 10px 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    opacity: 0;
    transition: 0.2s;
    font-size: 11px;
    font-weight: 500;
    pointer-events: none;
}
.gallery-item:hover .overlay { opacity: 1; }

.empty {
    width: 100%;
    text-align: center;
    padding: 80px 20px;
    color: #6c6c6c;
    background: #0b0b0b;
    border-radius: 32px;
    font-size: 16px;
}
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.98);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 6000;
}
.lightbox img { max-width: 92%; max-height: 80%; border-radius: 24px; object-fit: contain; }
.close-btn {
    position: absolute; top: 50px; right: 20px;
    font-size: 40px; cursor: pointer; color: white; width: 50px; height: 50px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.5); border-radius: 50%;
}
.loader {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10001;
}
.upload-box {
    width: 300px;
    background: #141414;
    padding: 28px;
    border-radius: 32px;
    text-align: center;
}
.progress-bar {
    width: 100%; height: 8px; background: #2c2c2c; border-radius: 20px; overflow: hidden; margin: 16px 0;
}
.progress-fill {
    width: 0%; height: 100%; background: linear-gradient(90deg, #00ffd5, #0099ff);
}
.progress-text { font-weight: bold; color: #00ffd5; font-size: 16px; }

/* Bottom navigation for mobile */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: rgba(12, 12, 12, 0.98);
    backdrop-filter: blur(20px);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 20px 12px;
    z-index: 997;
    border-top: 0.5px solid rgba(255,255,255,0.08);
}
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: #888;
    font-size: 12px;
    cursor: pointer;
    transition: 0.15s;
    padding: 6px 12px;
    border-radius: 30px;
}
.nav-item i { font-size: 22px; }
.nav-item.active { color: #00ffd5; }
.nav-item:active { background: rgba(255,255,255,0.1); }

@media (min-width: 768px) {
    .gallery { column-count: 3; padding-top: 155px; }
    .bottom-nav { display: none; }
    .search-box { display: block; }
    .search-toggle { display: none; }
}
@media (max-width: 480px) {
    .gallery { column-count: 2; }
    .user-name { display: none; }
    .user-info { padding: 4px 8px; }
}
</style>
</head>
<body>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.95); display:none; justify-content:center; align-items:center; z-index:9999999; flex-direction:column; gap:15px;">
    <div style="width:44px; height:44px; border:3px solid #333; border-top-color:#00ffd5; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    <p style="color:#00ffd5; font-size:14px;">Signing in...</p>
</div>
<style>
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>

<!-- LOGIN SECTION -->
<div class="auth-screen" id="loginScreen">
    <div class="auth-box">
        <div class="auth-logo"><i class="fa-brands fa-google"></i></div>
        <h1>KCST Gallery</h1><p>Your private cloud gallery</p>
        <button class="auth-btn google-btn" id="googleSignInLoginBtn"><i class="fa-brands fa-google"></i> Google Sign In</button>
        <div class="auth-divider">or</div>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button class="auth-btn" id="loginBtn"><i class="fa-solid fa-arrow-right-to-bracket"></i> Login</button>
        <div class="auth-error" id="loginError"></div>
        <div class="auth-switch">New? <span id="showRegisterBtn">Create account</span></div>
    </div>
</div>

<div class="auth-screen" id="registerScreen" style="display:none;">
    <div class="auth-box">
        <div class="auth-logo"><i class="fa-brands fa-google"></i></div>
        <h1>Join KCST</h1><p>Create your space</p>
        <button class="auth-btn google-btn" id="googleSignUpRegisterBtn"><i class="fa-brands fa-google"></i> Sign up with Google</button>
        <div class="auth-divider">or</div>
        <input type="email" id="registerEmail" placeholder="Email">
        <input type="password" id="registerPassword" placeholder="Password">
        <button class="auth-btn" id="registerBtn"><i class="fa-solid fa-user-check"></i> Register</button>
        <div class="auth-error" id="registerError"></div>
        <div class="auth-switch">Have account? <span id="showLoginBtn">Sign in</span></div>
    </div>
</div>

<!-- MAIN UI -->
<header>
    <div class="logo">
        <div class="logo-icon"><i class="fa-regular fa-images"></i></div>
        <div class="logo-text"><h1>KCST</h1><p id="userEmailDisplay">Gallery</p></div>
    </div>
    <div class="top-right">
        <button class="icon-btn search-toggle" id="searchToggleBtn"><i class="fa-solid fa-search"></i></button>
        <div class="user-info" id="userInfo" style="display: none;">
            <img id="userAvatar" class="user-avatar" alt="avatar">
            <span id="userName" class="user-name"></span>
        </div>
        <button class="icon-btn" id="uploadTriggerBtn"><i class="fa-solid fa-plus"></i></button>
        <button class="icon-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
</header>

<!-- Mobile Search Box (hidden by default) -->
<div class="search-box" id="mobileSearchBox" style="display: none;">
    <input type="text" id="searchInput" placeholder="Search images...">
    <i class="fa-solid fa-search"></i>
</div>

<!-- SELECTION BAR -->
<div class="selection-bar" id="selectionBar">
    <div><span id="selectedCount">0</span> <span style="font-size: 13px;">selected</span></div>
    <div class="selection-actions">
        <button class="action-btn select-all-btn" id="selectAllBtn" title="Select All"><i class="fa-regular fa-square-check"></i></button>
        <button class="action-btn clear-all-btn" id="clearAllBtn" title="Clear"><i class="fa-solid fa-eraser"></i></button>
        <button class="action-btn download-zip-btn" id="downloadZipBtn" title="ZIP"><i class="fa-solid fa-file-zipper"></i></button>
        <button class="action-btn download-btn" id="downloadEachBtn" title="Download"><i class="fa-solid fa-download"></i></button>
        <button class="action-btn delete-btn" id="deleteSelectedBtn" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
    </div>
</div>

<!-- BOTTOM NAVIGATION (Mobile) -->
<div class="bottom-nav" id="bottomNav">
    <button class="nav-item" id="navGalleryBtn"><i class="fa-regular fa-images"></i><span>Gallery</span></button>
    <button class="nav-item" id="navUploadBtn"><i class="fa-solid fa-plus-circle"></i><span>Upload</span></button>
    <button class="nav-item" id="navSelectBtn"><i class="fa-regular fa-check-square"></i><span>Select</span></button>
</div>

<input type="file" id="fileInput" hidden multiple accept="image/*">
<div class="gallery" id="gallery"><div class="empty" id="emptyBox"><i class="fa-regular fa-face-frown fa-3x" style="margin-bottom: 12px;"></i><h3>No images yet</h3><p>Tap + to upload</p></div></div>

<div class="lightbox" id="lightbox"><span class="close-btn" id="closeLightboxBtn">×</span><img id="lightboxImg" alt="preview"></div>
<div class="loader" id="loader"><div class="upload-box"><h3><i class="fa-regular fa-hourglass-half"></i> Uploading</h3><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div class="progress-text" id="progressText">0%</div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUuMUptpyEuYL8asBbA255ZKaz0_YpCoY",
  authDomain: "kcst-gallery.firebaseapp.com",
  databaseURL: "https://kcst-gallery-default-rtdb.firebaseio.com",
  projectId: "kcst-gallery",
  storageBucket: "kcst-gallery.firebasestorage.app",
  messagingSenderId: "150131028441",
  appId: "1:150131028441:web:438f0c28e31f48c2d1a9c8"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: 'select_account' });

// DOM elements
const galleryDiv = document.getElementById("gallery");
const emptyBoxDiv = document.getElementById("emptyBox");
const fileInput = document.getElementById("fileInput");
const loaderDiv = document.getElementById("loader");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const selectedCountSpan = document.getElementById("selectedCount");
const selectionBar = document.getElementById("selectionBar");
const userEmailDisplay = document.getElementById("userEmailDisplay");
const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const userName = document.getElementById("userName");
const loadingOverlay = document.getElementById("loadingOverlay");
const mobileSearchBox = document.getElementById("mobileSearchBox");
const searchToggleBtn = document.getElementById("searchToggleBtn");

selectionBar.style.display = "flex";

let selectedKeysSet = new Set();
let mediaItems = new Map();
let currentUserId = null;

// Mobile search toggle
searchToggleBtn.addEventListener("click", () => {
    if (mobileSearchBox.style.display === "none" || mobileSearchBox.style.display === "") {
        mobileSearchBox.style.display = "block";
        mobileSearchBox.classList.add("mobile-visible");
    } else {
        mobileSearchBox.style.display = "none";
        mobileSearchBox.classList.remove("mobile-visible");
    }
});

function updateSelectionUI() {
    const count = selectedKeysSet.size;
    selectedCountSpan.innerText = count;
    for (let [key, obj] of mediaItems.entries()) {
        if (selectedKeysSet.has(key)) obj.element.classList.add("selected");
        else obj.element.classList.remove("selected");
    }
}

function clearSelection() { selectedKeysSet.clear(); updateSelectionUI(); }
function toggleSelect(key) {
    if (selectedKeysSet.has(key)) selectedKeysSet.delete(key);
    else selectedKeysSet.add(key);
    updateSelectionUI();
}
function selectAllVisible() {
    for (let [key, obj] of mediaItems.entries()) {
        if (obj.element.style.display !== "none") selectedKeysSet.add(key);
    }
    updateSelectionUI();
}

function createGalleryCard(key, itemData) {
    const card = document.createElement("div");
    card.className = "gallery-item";
    card.dataset.key = key;
    card.dataset.url = itemData.url;
    const img = document.createElement("img");
    img.src = itemData.url;
    img.alt = itemData.name || "Image";
    img.loading = "lazy";
    img.onclick = (e) => { e.stopPropagation(); toggleSelect(key); };
    img.ondblclick = (e) => { e.stopPropagation(); openLightbox(itemData.url); };
    const checkDiv = document.createElement("div");
    checkDiv.className = "checkmark";
    checkDiv.innerHTML = '<i class="fa-solid fa-check"></i>';
    const overlayDiv = document.createElement("div");
    overlayDiv.className = "overlay";
    overlayDiv.innerHTML = `<div><i class="fa-regular fa-file-image"></i> ${itemData.name || "image"}</div>`;
    card.appendChild(img);
    card.appendChild(checkDiv);
    card.appendChild(overlayDiv);
    galleryDiv.appendChild(card);
    mediaItems.set(key, { element: card, url: itemData.url, name: itemData.name });
    return card;
}

function getUserGalleryRef() { return currentUserId ? ref(database, `users/${currentUserId}/gallery`) : null; }

function loadGallery() {
    const galleryRef = getUserGalleryRef();
    if (!galleryRef) { galleryDiv.innerHTML = ""; galleryDiv.appendChild(emptyBoxDiv); return; }
    onValue(galleryRef, (snapshot) => {
        galleryDiv.innerHTML = "";
        mediaItems.clear();
        selectedKeysSet.clear();
        updateSelectionUI();
        if (!snapshot.exists()) { galleryDiv.appendChild(emptyBoxDiv); return; }
        const data = snapshot.val();
        const entries = Object.entries(data).reverse();
        let hasImages = false;
        for (const [key, item] of entries) {
            const imgUrl = item.url || item.display_url;
            if (!imgUrl) continue;
            hasImages = true;
            createGalleryCard(key, { name: item.name || "untitled", url: imgUrl });
        }
        if (!hasImages) galleryDiv.appendChild(emptyBoxDiv);
    });
}

async function deleteSelected() {
    if (selectedKeysSet.size === 0) return;
    const delBtn = document.getElementById("deleteSelectedBtn");
    const originalIcon = delBtn.innerHTML;
    delBtn.innerHTML = '<i class="fa-solid fa-spinner fa-pulse"></i>';
    delBtn.disabled = true;
    try {
        const promises = [];
        for (const key of selectedKeysSet) {
            promises.push(remove(ref(database, `users/${currentUserId}/gallery/${key}`)));
        }
        await Promise.all(promises);
        selectedKeysSet.clear();
        updateSelectionUI();
    } catch(e) { console.error(e); } finally {
        delBtn.innerHTML = originalIcon;
        delBtn.disabled = false;
    }
}

function downloadEach() {
    if (selectedKeysSet.size === 0) return;
    for (let key of selectedKeysSet) {
        const item = mediaItems.get(key);
        if (item && item.url) {
            const link = document.createElement("a");
            link.href = item.url;
            link.download = item.name.replace(/\s+/g, '_') || "KCST_image";
            link.click();
        }
    }
}

async function downloadAsZip() {
    if (selectedKeysSet.size === 0) return;
    const toast = document.createElement("div");
    toast.style.position = "fixed"; toast.style.bottom = "70px"; toast.style.left = "16px"; toast.style.right = "16px";
    toast.style.backgroundColor = "#000000cc"; toast.style.backdropFilter = "blur(10px)"; toast.style.padding = "12px";
    toast.style.borderRadius = "40px"; toast.style.zIndex = "10000"; toast.style.color = "#00ffd5";
    toast.style.fontWeight = "bold"; toast.style.textAlign = "center"; toast.innerText = "📦 Creating ZIP...";
    document.body.appendChild(toast);
    const zip = new JSZip();
    let successCount = 0;
    for (let key of selectedKeysSet) {
        const item = mediaItems.get(key);
        if (item && item.url) {
            try {
                const response = await fetch(item.url);
                const blob = await response.blob();
                let ext = blob.type.split('/')[1] || 'jpg';
                zip.file(`${item.name || "image"}_${key.slice(-6)}.${ext}`, blob);
                successCount++;
            } catch(e) {}
        }
    }
    if (successCount === 0) { toast.innerText = "❌ Failed"; setTimeout(() => toast.remove(), 1500); return; }
    const zipBlob = await zip.generateAsync({ type: "blob" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(zipBlob);
    link.download = `KCST_gallery.zip`;
    link.click();
    URL.revokeObjectURL(link.href);
    toast.innerText = "✅ ZIP ready!";
    setTimeout(() => toast.remove(), 1500);
}

fileInput.addEventListener("change", async function(e) {
    const files = Array.from(this.files);
    if (!files.length || !currentUserId) return;
    loaderDiv.style.display = "flex";
    let completed = 0;
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        try {
            const percent = Math.floor((i / files.length) * 100);
            progressFill.style.width = percent + "%";
            progressText.innerText = percent + "%";
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch("https://api.imgbb.com/1/upload?key=32a7a8ae20c5f60ec2456e2bbc9f0f39", { method: "POST", body: formData });
            const data = await response.json();
            if (!data.success) throw new Error();
            await push(ref(database, `users/${currentUserId}/gallery`), { name: file.name, url: data.data.display_url, size: file.size, created: Date.now() });
            completed++;
            progressFill.style.width = Math.floor((completed / files.length) * 100) + "%";
            progressText.innerText = Math.floor((completed / files.length) * 100) + "%";
        } catch(err) { alert(`Upload error: ${file.name}`); }
    }
    setTimeout(() => { loaderDiv.style.display = "none"; progressFill.style.width = "0%"; progressText.innerText = "0%"; }, 500);
    fileInput.value = "";
});

function openLightbox(src) { document.getElementById("lightbox").style.display = "flex"; document.getElementById("lightboxImg").src = src; }
document.getElementById("closeLightboxBtn").onclick = () => document.getElementById("lightbox").style.display = "none";
document.getElementById("searchInput").addEventListener("input", function() {
    const term = this.value.toLowerCase();
    for (let [key, obj] of mediaItems.entries()) {
        obj.element.style.display = (obj.name || "").toLowerCase().includes(term) ? "block" : "none";
    }
});

// Auth functions
async function googleSignIn() {
    loadingOverlay.style.display = "flex";
    try { await signInWithPopup(auth, googleProvider); } catch(e) { document.getElementById("loginError").innerHTML = e.message; } finally { loadingOverlay.style.display = "none"; }
}
async function googleSignUp() {
    loadingOverlay.style.display = "flex";
    try { await signInWithPopup(auth, googleProvider); } catch(e) { document.getElementById("registerError").innerHTML = e.message; } finally { loadingOverlay.style.display = "none"; }
}
async function loginUser() { try { await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value, document.getElementById("loginPassword").value); } catch(e) { document.getElementById("loginError").innerHTML = e.message; } }
async function registerUser() { try { await createUserWithEmailAndPassword(auth, document.getElementById("registerEmail").value, document.getElementById("registerPassword").value); alert("Account created! Please login."); showLogin(); } catch(e) { document.getElementById("registerError").innerHTML = e.message; } }
function showRegister() { document.getElementById("loginScreen").style.display = "none"; document.getElementById("registerScreen").style.display = "flex"; }
function showLogin() { document.getElementById("registerScreen").style.display = "none"; document.getElementById("loginScreen").style.display = "flex"; }
async function logoutUser() { await signOut(auth); clearSelection(); }

// Event listeners
document.getElementById("googleSignInLoginBtn").onclick = googleSignIn;
document.getElementById("googleSignUpRegisterBtn").onclick = googleSignUp;
document.getElementById("loginBtn").onclick = loginUser;
document.getElementById("registerBtn").onclick = registerUser;
document.getElementById("showRegisterBtn").onclick = showRegister;
document.getElementById("showLoginBtn").onclick = showLogin;
document.getElementById("logoutBtn").onclick = logoutUser;
document.getElementById("selectAllBtn").onclick = selectAllVisible;
document.getElementById("clearAllBtn").onclick = clearSelection;
document.getElementById("downloadZipBtn").onclick = downloadAsZip;
document.getElementById("downloadEachBtn").onclick = downloadEach;
document.getElementById("deleteSelectedBtn").onclick = deleteSelected;
document.getElementById("uploadTriggerBtn").onclick = () => fileInput.click();
document.getElementById("navUploadBtn").onclick = () => fileInput.click();
document.getElementById("navSelectBtn").onclick = () => { if (mediaItems.size) selectAllVisible(); };
document.getElementById("navGalleryBtn").onclick = () => { document.getElementById("searchInput").value = ""; document.getElementById("searchInput").dispatchEvent(new Event('input')); };

// Auth state
onAuthStateChanged(auth, (user) => {
    if (user) {
        currentUserId = user.uid;
        const displayName = user.displayName || user.email.split('@')[0];
        userEmailDisplay.textContent = displayName.length > 12 ? displayName.slice(0,10)+".." : displayName;
        userInfo.style.display = "flex";
        if (user.photoURL) userAvatar.src = user.photoURL;
        userName.textContent = displayName;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("registerScreen").style.display = "none";
        loadGallery();
    } else {
        currentUserId = null;
        userInfo.style.display = "none";
        document.getElementById("loginScreen").style.display = "flex";
        galleryDiv.innerHTML = ""; galleryDiv.appendChild(emptyBoxDiv);
        mediaItems.clear(); selectedKeysSet.clear(); updateSelectionUI();
    }
});

// Keep selection visible
setInterval(() => { if (selectionBar.style.display !== 'flex') selectionBar.style.display = 'flex'; }, 500);
document.addEventListener("keydown", (e) => { if (e.key === 'Delete' && selectedKeysSet.size) deleteSelected(); if (e.key === 'Escape') clearSelection(); });
console.log("✅ KCST Gallery — Mobile app optimized");
